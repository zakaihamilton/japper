<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <defs>
        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#4338ca;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Background Container -->
    <rect width="512" height="512" rx="128" fill="url(#grad1)" />

    <!-- JSON Brace (Left) -->
    <path
        d="M160 128 
           c-20 0 -40 20 -40 60 
           v40 
           c0 20 -20 30 -40 30 
           c20 0 40 10 40 30 
           v40 
           c0 40 20 60 40 60"
        fill="none" stroke="white" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Mapping Arrow/Transformation -->
    <path d="M200 256 h80 l-20 -20 m20 20 l-20 20"
        fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="24" stroke-linecap="round"
        stroke-linejoin="round" />

    <!-- Mapped Lines (Right) -->
    <line x1="320" y1="150" x2="420" y2="150" stroke="white" stroke-width="32"
        stroke-linecap="round" />
    <line x1="320" y1="220" x2="400" y2="220" stroke="white" stroke-width="32"
        stroke-linecap="round" />
    <line x1="320" y1="290" x2="420" y2="290" stroke="white" stroke-width="32"
        stroke-linecap="round" />
    <line x1="320" y1="360" x2="380" y2="360" stroke="white" stroke-width="32"
        stroke-linecap="round" />
</svg>